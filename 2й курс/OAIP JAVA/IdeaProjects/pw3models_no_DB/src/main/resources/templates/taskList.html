<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Задания</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h1>Задания</h1>

<a href="/tasks/list">Сбросить фильтр</a><br><br>

<form th:action="@{/tasks/list}" method="get">
  Поиск по ID:
  <input type="number" name="id" th:value="${searchId}" placeholder="Введите ID"/>
  <button type="submit">Найти по ID</button>
</form>

<br>
<form th:action="@{/tasks/list}" method="get">
  Поиск по названию:
  <input type="text" name="title" th:value="${searchTitle}"/>
  <button type="submit">Найти</button>
</form>

<br>

<button onclick="document.getElementById('addForm').style.display='block'">+ Добавить задание</button>

<table>
  <tr>
    <th>ID</th>
    <th>Название</th>
    <th>Описание</th>
    <th>Срок</th>
    <th>Цена</th>
    <th>Действия</th>
  </tr>
  <tr th:each="task : ${tasks}">
    <form th:action="@{/tasks/update}" method="post">
      <td><input type="hidden" name="id" th:value="${task.id}" /> <span th:text="${task.id}"></span></td>
      <td><input type="text" name="title" th:value="${task.title}" style="width:100%"></td>
      <td><input type="text" name="description" th:value="${task.description}" style="width:100%" required></td>
      <td><input type="date" name="deadline" th:value="${task.deadline}"></td>
      <td><input type="number" name="price" step="0.01" th:value="${task.price}" style="width:80px"></td>
      <td>
        <input type="hidden" name="userId" th:value="${task.user.id}">
        <input type="hidden" name="categoryId" th:value="${task.category.id}">
        <button type="submit">Сохранить</button>
      </td>
    </form>
    <td>
      <form th:action="@{/tasks/delete}" method="post" style="display:inline;">
        <input type="hidden" name="id" th:value="${task.id}"/>
        <button type="submit" onclick="return confirm('Удалить?')">Удалить</button>
      </form>
    </td>
  </tr>
</table>

<div id="addForm" style="display:none; margin-top:30px; border:2px solid #666; padding:20px; max-width:500px;">
  <h3>Добавить новое задание</h3>
  <form th:action="@{/tasks/add}" method="post">
    Название: <input type="text" name="title" required style="width:100%"><br><br>
    Описание: <textarea name="description" rows="3" style="width:100%"></textarea><br><br>
    Срок выполнения: <input type="date" name="deadline" required><br><br>
    Цена (от 500): <input type="number" name="price" step="0.01" min="500" required><br><br>
    ID создателя: <input type="number" name="userId" required><br><br>
    ID категории: <input type="number" name="categoryId" required><br><br>
    <button type="submit">Добавить задание</button>
  </form>
</div>
<div style="margin-top:20px;">

  <!-- Назад -->
  <a th:if="${currentPage > 1}"
     th:href="@{/tasks/list(page=${currentPage - 1}, title=${searchTitle}, id=${searchId})}">
    ← Назад
  </a>

  <!-- Вперед -->
  <a th:if="${currentPage < totalPages}"
     th:href="@{/tasks/list(page=${currentPage + 1}, title=${searchTitle}, id=${searchId})}">
    Вперёд →
  </a>

</div>
</body>
</html>
